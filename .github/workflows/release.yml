name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.4.0

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test (linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --workspace --locked

      - name: Package (linux)
        if: matrix.os == 'ubuntu-22.04'
        run: tar -czf vibedeck-${{ env.VERSION }}-x86_64-linux.tar.gz -C target/release vibedeck

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\vibedeck.exe -DestinationPath vibedeck-${{ env.VERSION }}-x86_64-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'ubuntu-22.04' && 'linux-x86_64' || 'windows-x86_64' }}
          path: |
            vibedeck-${{ env.VERSION }}-x86_64-linux.tar.gz
            vibedeck-${{ env.VERSION }}-x86_64-windows.zip
          if-no-files-found: ignore

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VibeDeck v${{ env.VERSION }}
          prerelease: true
          files: dist/*
          body: |
            **VibeDeck — fast, native desktop GUI (Rust · egui · wgpu) for the Mistral Vibe CLI.**

            > ⚠️ VibeDeck is an **unofficial community project** and is not affiliated with, endorsed by, or supported by Mistral AI.

            ## Binaries

            | Platform | File |
            |---|---|
            | Linux (x86_64, glibc) | `vibedeck-0.4.0-x86_64-linux.tar.gz` |
            | Windows (x86_64) | `vibedeck-0.4.0-x86_64-windows.zip` |

            ## Requirements

            - The Mistral Vibe CLI installed and on PATH:

              ```sh
              # with uv (recommended)
              curl -LsSf https://astral.sh/uv/install.sh | sh
              uv tool install mistral-vibe

              # or with pip
              pip install mistral-vibe
              ```

              VibeDeck can also install/upgrade the CLI for you from the Setup screen.

            - Linux: X11 or Wayland session; on Wayland set `WINIT_UNIX_BACKEND=x11` if needed.

            ## Run

            ```sh
            tar -xzf vibedeck-0.4.0-x86_64-linux.tar.gz
            ./vibedeck
            ```

            ## What's new in v0.4.0

            - 🎨 **1:1 Nexus look** — the original Mistral Vibe Nexus palette, header,
              sidebar, message bubbles and the pixel-flame empty state.
            - 📂 **Projects** — recent folders list, add/switch project from the sidebar.
            - 🕘 **Session history** — CLI sessions (name · date · folder) with resume.
            - 🚀 **Fast startup** — dependency probe & file indexing moved off the startup path.
            - 🖼 **App icon** — the original window/taskbar icon on Linux and Windows.
            - 🚫 **No stray console window** on Windows anymore.

            On first launch open **Setup** to verify the CLI, then start chatting — the first
            message triggers the Mistral login flow in the terminal-less session.
