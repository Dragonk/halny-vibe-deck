name: release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.8.3
  PDFIUM_TAG: chromium/7881

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test (linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --workspace --locked

      - name: Fetch pdfium (linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -sL https://github.com/bblanchon/pdfium-binaries/releases/download/${{ env.PDFIUM_TAG }}/pdfium-linux-x64.tgz | tar -xz
          cp lib/libpdfium.so target/release/

      - name: Package (linux)
        if: matrix.os == 'ubuntu-22.04'
        run: tar -czf mistraldeck-app-${{ env.VERSION }}-x86_64-linux.tar.gz -C target/release mistraldeck-app libpdfium.so

      - name: Fetch pdfium (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          curl.exe -sL -o pdfium.tgz https://github.com/bblanchon/pdfium-binaries/releases/download/${{ env.PDFIUM_TAG }}/pdfium-win-x64.tgz
          tar -xzf pdfium.tgz bin/pdfium.dll
          Copy-Item bin\pdfium.dll target\release\

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\mistraldeck-app.exe,target\release\pdfium.dll -DestinationPath mistraldeck-app-${{ env.VERSION }}-x86_64-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'ubuntu-22.04' && 'linux-x86_64' || 'windows-x86_64' }}
          path: |
            mistraldeck-app-${{ env.VERSION }}-x86_64-linux.tar.gz
            mistraldeck-app-${{ env.VERSION }}-x86_64-windows.zip
          if-no-files-found: ignore

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mistral Deck v${{ env.VERSION }}
          prerelease: true
          files: dist/*
          body: |
            **Mistral Deck (legacy egui build) — fast, native desktop GUI (Rust · egui · wgpu) for the Mistral Vibe CLI.**

            > ⚠️ Mistral Deck is an **unofficial community project** and is not affiliated with, endorsed by, or supported by Mistral AI.

            ## Binaries

            | Platform | File |
            |---|---|
            | Linux (x86_64, glibc) | `mistraldeck-app-0.8.3-x86_64-linux.tar.gz` |
            | Windows (x86_64) | `mistraldeck-app-0.8.3-x86_64-windows.zip` |

            ## Requirements

            - The Mistral Vibe CLI installed and on PATH:

              ```sh
              # with uv (recommended)
              curl -LsSf https://astral.sh/uv/install.sh | sh
              uv tool install mistral-vibe

              # or with pip
              pip install mistral-vibe
              ```

              Mistral Deck can also install/upgrade the CLI for you from the Setup screen.

            - Linux: X11 or Wayland session; on Wayland set `WINIT_UNIX_BACKEND=x11` if needed.

            ## Run

            ```sh
            tar -xzf mistraldeck-app-0.8.3-x86_64-linux.tar.gz
            ./mistraldeck-app
            ```

            The archive bundles the [pdfium](https://github.com/bblanchon/pdfium-binaries)
            library next to the binary — keep them together so PDF previews render.


            ## What's new in v0.8.3

            Fixes the text-overflow issue reported after 0.8.2:

            - **Long messages no longer overflow the window.** Messages with long
              paragraphs (typical for pasted documents and detailed prompts) were
              laid out as a single unwrapped line inside their frame; when the line
              was wider than the window it was clipped at **both** edges at once —
              the text looked like it was "escaping" the window. Every message
              label in the chat (user bubbles) and in the stats drill-down
              transcript now wraps at the available width, so long content stays
              inside the window like the rest of the UI.
            - Short messages were unaffected — which is why the issue only showed
              up on long, real-world conversations.

            ## Also in v0.8.2

            Fixes for the rendering issues reported after 0.8.1:

            - **CLI sessions load their full history again.** A race between
              the background "prime" session and a clicked CLI session made
              the replayed history get silently discarded — the chat showed
              a single leftover fragment instead of the whole conversation.
              The primed session can no longer cancel a session/load that
              is still in flight, and the tail of the replay no longer
              leaks into the live message stream.
            - **Mermaid diagrams now render inside the chat.** Replies that
              contain ```mermaid blocks drew a wall of source code where
              Nexus shows actual diagrams — flowcharts (rect / round /
              stadium / circle / cylinder / diamond / flag nodes, labeled
              edges), sequence diagrams and pie charts are now drawn
              inline, with a code-block fallback for unsupported syntax.
            - **Session drill-down works with the new CLI log format.**
              Sessions recorded by newer CLI versions store their
              transcript in chunk snapshots instead of messages.jsonl,
              so the stats drill-down showed an empty transcript. It now
              reads the unified format (turn-ordered, tool calls with
              names, tool outputs) and also finds sessions under
              logs/session/unified/&lt;id&gt;.
            - Drill-down assistant messages show their tool calls (tool
              name + command) above the reply, like the chat view.

            ## Also in v0.8.1

            This release fixes the two biggest complaints from 0.8.0 — how
            replayed conversations look, and how the stats dashboard compares
            to Mistral Vibe Nexus.

            Chat & replay fixes:

            - **Replayed tool calls now show their real status and output.**
              Previously every tool call from a reloaded session rendered as
              a forever-spinning one-line "bash: <command>" — the whole
              conversation collapsed into a wall of log text. Tool calls now
              replay as completed/failed with their output, rendered with the
              same rich formatting as live ones (stdout/stderr/exit codes,
              colorized diff blocks, todo lists, subagent transcripts).
            - **Shorter, readable tool titles** — full commands are no longer
              dumped into the header line; long ones are trimmed with an
              ellipsis.
            - **Markdown layout no longer breaks** on long unbroken tokens
              (paths, URLs): code blocks and inline code wrap instead of
              stretching the chat column, and code fences inside a message no
              longer swallow the rest of the reply.

            Stats, pixel-for-pixel with Nexus:

            - Cards redesigned to the Nexus layout — subtitle, large value,
              right-aligned meta.
            - Cost and token charts now have real axes: a Y grid with labels
              and date labels on X. Token bars stack input/output with
              Both/Input/Output pills and a legend.
            - Tool usage donut draws the total in the center; the activity
              heatmap spans 13 weeks with the Nexus five-level green scale.
            - Recent sessions list: rounded rows with project/model tags and
              cost on the right, newest first, up to 20.
            - Session drill-down now renders the transcript like the chat
              view — markdown for assistant messages, right-aligned bubbles
              for user messages, muted tool blocks — instead of raw JSON
              soup.

            ## Also in v0.8.0

            Previews & chat:

            - 🧜 **Mermaid diagrams render offline** — a built-in local
              renderer draws flowcharts, sequence diagrams and pie charts
              (no internet, no mermaid.ink, your diagrams never leave the
              app). Unsupported diagram types fall back to the source code.
            - 📝 **Rich Markdown previews** — nested lists, task lists,
              blockquotes, GFM tables with alignment, rules, bold/italic/
              strikethrough and clickable links all render properly now.
            - 🔧 **Rich tool calls** — bash blocks with `$ command`,
              stdout/stderr and exit code, read/edit chips with red/green
              SEARCH/REPLACE diffs, grep blocks, and collapsible subagent
              transcripts. Status colors: yellow while running, green when
              OK, red on error.
            - ❓ **Question dialogs are real GUIs** — the agent's
              ask-user questions render answer buttons *and* a free-text
              field, just like the reference client.
            - 💬 **Chat layout hardened** — long messages always wrap inside
              their bubbles (no more stretched views) and the session list
              always shows the newest conversation on top.

            Stats & settings:

            - 📊 **Stats dashboard rebuilt** — 7d / 30d / 90d / all-time /
              custom date ranges plus a model filter; cards for total spend
              (cumulative area chart), tokens (bar chart), cache hit rate,
              activity heatmap, tool-usage donut, and a clickable recent
              sessions list with project/model/cost tags.
            - ⚙️ **Settings reorganized** — General / Agent (ACP) /
              Providers / Models / MCP / Tools / Skills / Agents / Prompts /
              Raw TOML. Setup merged into Settings → Agent (still available
              on first run), with telemetry, trust store and session
              logging in one place.
            - 🌐 **Six languages** — Automatic (System) plus English,
              Polski, Deutsch, Français, Español and Italiano, switchable at
              runtime.

            Look & feel:

            - 🎨 **Nexus-style sidebar** — full-width accent *New session*
              button, `dd.mm.yyyy · folder` session metadata, and Setup
              removed from the navigation.
            - 🪟 **Rounded window corners** on Windows 11 (DWM), matching
              other modern apps.
            - 🖱 **Grab-able scrollbars** in previews (always visible, wider)
              and file-tab close buttons (✕) sit in the same pill as the
              tab name.

            ## Also in v0.7.0

            Sessions & settings:

            - 💬 **CLI session history is fully restored** — clicking a session
              in *History from CLI* now replays the real conversation
              (user/assistant messages, thinking blocks, tool calls) into the
              UI instead of showing an empty mirror. Already-loaded sessions
              switch instantly, and a load in progress is indicated.
            - ⚙️ **Settings redesigned** — the General tab is organized into
              clear sections: Application, Agent (vibe-acp), Working
              directory, and Mistral Vibe CLI (config.toml), with a modern
              tab bar.
            - 🌐 **Language is a dropdown** — System / English / Polski
              (System follows your OS locale).
            - 🌓 **Theme follows the OS** — a new *System* option beside
              Dark/Light; Mistral Deck switches automatically when your OS
              switches.
            - 🤖 **Active model, default agent & CLI theme as dropdowns** —
              model aliases come from your config, the agent list includes
              your `~/.vibe/agents` (top-level), written back to
              `~/.vibe/config.toml` via 💾 Save.
            - 🗂 **Configurable sidebar session limit** (5–100).

            ## Also in v0.6.0

            Real file previews — no more plain text dumps:

            - 📄 **PDF pages are rendered** (via bundled pdfium) — actual page
              images with the original layout, scrollable, first pages first.
            - 📝 **DOCX renders as a document** — headings sized and colored,
              bold/italic/underline/strikethrough, lists, tables, centered or
              right-aligned paragraphs, hyperlinks preserved.
            - 📊 **XLSX opens like Excel** — sheet tabs at the bottom, header
              row, striped rows, column auto-sizing, multiple sheets (up to 16).
            - 🖼 **PPTX shows actual slides** — real 16:9 slide geometry, shape
              fills, centered/aligned text runs, embedded slide pictures, with
              slide navigation.
            - 🧜 **Mermaid diagrams in Markdown** — ```mermaid blocks are
              rendered as images inline in the preview (via mermaid.ink; the
              diagram source is sent to that service — see README).
            - 📈 CSV/TSV and plain images unchanged, plus a nicer markdown
              render with headings, lists and code blocks.

            ## Also in v0.5.2

            - 🎛 **Model / mode / thinking dropdowns work** — clicking a chip
              now opens the choice list (the v0.5.1 popup never survived the
              frame), with the current value highlighted and real values
              loaded as soon as the app connects.
            - ⚡ **Slash commands are back and richer** — `/` now lists the
              agent's commands (with hints), plus your skills and prompts
              from `~/.vibe`, exactly like the Nexus picker.
            - 🖇 **File previews are tabs now** — clicking a file in the
              workspace dock opens it as a tab next to Files / Git (closeable,
              scrollable tab strip).
            - 📊 **Friendly previews for many formats** — Markdown renders
              nicely, CSV/TSV/Excel show as a table (first sheet), docx/pptx
              and PDF show extracted text, images (png/jpg/gif/bmp/webp/tiff)
              render inline, source/config files show as text.

            ## Also in v0.5.1

            - 🛠 **Window resize & drag fixed** — edge/corner resize zones
              hand the resize to the OS the way PhotoCraft does; a stuck press
              after a move/resize no longer blocks the next one.
            - 🎛 **Model / mode / thinking pickers back** — always visible in the
              input card (Nexus layout, popups open upward), fed by the ACP
              agent's `configOptions`, switchable mid-session.
            - 🔤 **All icons render on Windows** — bundled Noto Sans Symbols 2
              (OFL) as a fallback font: send ➤, stop ⏹, window ✕ □ — and
              everything else — no more tofu squares.
            - 💬 **@ and / popups work again** — file mentions and slash commands
              show their suggestions while you type.
            - 🎨 **Input card 1:1 with Nexus** — toolbar inside the card, folder
              button, 30×30 send/stop, separators and paddings per the
              original CSS.

            ## Also in v0.5.0

            - 🪟 **Frameless window** — no native titlebar (like Photocraft): custom
              Nexus header with ─ □ ✕ buttons, drag-to-move, double-click to maximize,
              edge/corner resize.
            - 🗂 **Workspace dock (Claude-Cowork style)** — right-hand panel with a lazy
              file tree, file preview, Git status & per-file diff, auto-refreshed after
              each turn.
            - 📊 **Cache stats** — cached-token cost and **cache hit rate** in live usage
              and in Statistics.
            - 🔲 **Sidebar done right** — always-present, collapsible to an icon rail;
              Config / Statistics / Settings open beside the sidebar (closeable ✕),
              no longer full-screen.
            - 📂 **Folder picker fixed** — fixed-size dialog with always-visible ✔/✕.
            - 🧹 Session & project switching repairs, minor UX polish.

            On first launch open **Setup** to verify the CLI, then start chatting — the first
            message triggers the Mistral login flow in the terminal-less session.
