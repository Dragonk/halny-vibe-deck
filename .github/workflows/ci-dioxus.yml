name: ci-dioxus

on:
  push:
    branches:
      - next

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: /home/runner/vd-target

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Check wasm client
        run: cargo check -p mistraldeck --target wasm32-unknown-unknown --features web --locked

      - name: Test (workspace)
        run: cargo test --workspace --locked

      - name: Test (mistraldeck, server feature)
        run: cargo test -p mistraldeck --features server --locked

      - name: Check appserver (headless)
        run: cargo check -p mistraldeck-appserver --locked

  check-windows:
    name: Check windows-gnu (server,gui + icon build script)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: cargo check windows-gnu
        run: cargo check -p mistraldeck --features server,gui --target x86_64-pc-windows-gnu --locked

      - name: cargo check appserver windows-gnu
        run: cargo check -p mistraldeck-appserver --target x86_64-pc-windows-gnu --locked

  e2e:
    name: E2E (headless server + Playwright)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Cache dioxus-cli
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-cli-0.7.10-${{ runner.os }}

      - name: Install dioxus-cli
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build web bundle (wasm + public/)
        working-directory: crates/mistraldeck
        run: dx build --fullstack --web

      - name: Build headless server
        run: cargo build -p mistraldeck-appserver --locked

      - name: Stage runtime dir (binary + public/)
        run: |
          PUBLIC=$(find "$CARGO_TARGET_DIR/dx" -maxdepth 5 -type d -path '*/web/public' | head -1)
          test -n "$PUBLIC" || { echo "::error::no dx public bundle found"; find "$CARGO_TARGET_DIR/dx" -maxdepth 4 -type d | head -20; exit 1; }
          echo "::notice::public bundle: $PUBLIC"
          rm -rf .e2e-run && mkdir -p .e2e-run
          cp "${CARGO_TARGET_DIR:-target}/debug/halny-vibe-deck-appserver" .e2e-run/
          cp -r "$PUBLIC" .e2e-run/public

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (chromium)
        working-directory: scripts/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Prepare config (login + remote listener)
        run: |
          chmod +x scripts/e2e/stub-agent.py
          export XDG_CONFIG_HOME="$PWD/.e2e-config"
          BIN="${CARGO_TARGET_DIR:-target}/debug/halny-vibe-deck-appserver"
          test -x "$BIN" || BIN="target/debug/halny-vibe-deck-appserver"
          mkdir -p "$XDG_CONFIG_HOME"
          "$BIN" --set-login e2e e2e-secret >/dev/null 2>&1 || true
          CFG="$XDG_CONFIG_HOME/halny-vibe-deck/config.json"
          test -f "$CFG" || { mkdir -p "$(dirname "$CFG")"; echo '{}' > "$CFG"; }
          python3 - "$CFG" <<'EOF'
          import json, os, sys
          p = sys.argv[1]
          cfg = json.load(open(p))
          cfg["remote_enabled"] = True
          cfg["remote_port"] = 8443
          cfg["agent_path"] = os.path.abspath("scripts/e2e/stub-agent.py")
          json.dump(cfg, open(p, "w"), indent=2)
          EOF
          cat "$CFG"

      - name: Start headless server
        run: |
          export XDG_CONFIG_HOME="$PWD/.e2e-config"
          export VD_STUB_TRACE="$PWD/../.e2e-stub.log"
          echo "::notice::server binary: $PWD/.e2e-run/halny-vibe-deck-appserver"
          cd .e2e-run
          nohup ./halny-vibe-deck-appserver --mode headless --port 8080 > ../.e2e-server.log 2>&1 &
          echo $! > ../.e2e-server.pid
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/manifest.webmanifest >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            while IFS= read -r line; do echo "::error::server: $line"; done < <(tail -40 ../../.e2e-server.log || true)
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -skf https://127.0.0.1:8443/login >/dev/null; then ok=2; break; fi
            sleep 1
          done
          if [ "$ok" != "2" ]; then
            while IFS= read -r line; do echo "::error::server: $line"; done < <(tail -40 ../../.e2e-server.log || true)
            exit 1
          fi

      - name: Run e2e
        working-directory: scripts/e2e
        env:
          VD_LOCAL_URL: http://127.0.0.1:8080
          VD_REMOTE_URL: https://127.0.0.1:8443
        run: |
          set +e
          npx playwright test 2>&1 | tee ../.e2e-tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            while IFS= read -r line; do echo "::error::assert: $line"; done < <(grep -E "Expected|Received|toBe|locator|Timeout|waiting for" ../.e2e-tests.log | head -60)
            echo "::error::--- server log ---"
            while IFS= read -r line; do echo "::error::server: $line"; done < <(tail -40 ../../.e2e-server.log)
            echo "::error::--- stub trace ---"
            while IFS= read -r line; do echo "::error::stub: $line"; done < <(tail -60 ../../.e2e-stub.log 2>/dev/null || true)
          fi
          exit $rc

      - name: Server log
        if: always()
        run: tail -100 .e2e-server.log || true

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: scripts/e2e/test-results
          if-no-files-found: ignore
