name: ci-e2e

# Golden e2e suite for the stable edition. The same scenarios run in the Rust
# edition (branch `next`, job `e2e` of ci-dioxus.yml), so both editions are
# measured against one behavioural contract.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (headless serve + Playwright)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm ci

      - name: Build (main + preload + renderer)
        run: npm run build

      - name: Unit tests (node:test)
        run: npm run test:unit

      - name: Install Playwright (chromium)
        working-directory: scripts/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Start headless serve
        run: |
          mkdir -p .e2e-config
          nohup xvfb-run -a npx electron . --serve --headless \
            --user e2e --password e2e-secret --port 8443 \
            > .e2e-serve.log 2>&1 &
          echo $! > .e2e-serve.pid
          ok=0
          for i in $(seq 1 60); do
            if curl -skf https://127.0.0.1:8443/login >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            while IFS= read -r line; do echo "::error::serve: $line"; done < <(tail -40 .e2e-serve.log || true)
            exit 1
          fi

      - name: Run e2e
        working-directory: scripts/e2e
        env:
          VD_REMOTE_URL: https://127.0.0.1:8443
        run: |
          set +e
          npx playwright test 2>&1 | tee ../.e2e-tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            {
              echo "== assertions =="
              grep -E "Expected|Received|toBe|locator|Timeout|waiting for" ../.e2e-tests.log | head -40
              echo "== serve log =="
              tail -40 ../../.e2e-serve.log 2>/dev/null
            } | head -c 60000 > ../.e2e-diag.txt
            echo "::error::$(tr '\n' '~' < ../.e2e-diag.txt | sed 's/~/%0A/g')"
          fi
          exit $rc

      - name: Auth e2e (session survives restart, failure-only limiter)
        run: |
          B=https://127.0.0.1:8443
          J="$PWD/.e2e-cookies.txt"
          code() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }
          # Repeated SUCCESSFUL logins must never trip the guard (v1.0.36:
          # it used to answer 429 after eight good sign-ins).
          for i in $(seq 1 8); do
            got=$(code -c "$J" -X POST "$B/api/auth/login" -H 'Content-Type: application/json' \
              -d '{"username":"e2e","password":"e2e-secret"}')
            [ "$got" = "200" ] || { echo "::error::successful login #$i returned $got"; exit 1; }
          done
          # A wrong password is 401 and must not lock the account out.
          got=$(code -X POST "$B/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"e2e","password":"wrong"}')
          [ "$got" = "401" ] || { echo "::error::bad login returned $got (expected 401)"; exit 1; }
          got=$(code -b "$J" "$B/")
          [ "$got" = "200" ] || { echo "::error::authenticated GET returned $got"; exit 1; }
          # Restart the serve process: sessions are signed blobs bound to a
          # persistent key, so the device stays signed in.
          kill "$(cat .e2e-serve.pid)" 2>/dev/null || true
          sleep 2
          nohup xvfb-run -a npx electron . --serve --headless \
            --user e2e --password e2e-secret --port 8443 \
            > .e2e-serve.log 2>&1 &
          echo $! > .e2e-serve.pid
          for i in $(seq 1 60); do
            if curl -skf "$B/login" >/dev/null; then break; fi
            sleep 2
          done
          got=$(code -b "$J" "$B/")
          if [ "$got" != "200" ]; then
            echo "::error::session did not survive the restart (GET / -> $got)"
            exit 1
          fi

      - name: Serve log
        if: always()
        run: tail -60 .e2e-serve.log || true

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stable-e2e-traces
          path: scripts/e2e/test-results
          if-no-files-found: ignore
