# Continuous integration: validates every push to main and every PR.
# This workflow NEVER publishes a release. Releases are created only when
# an explicit version tag (v*) is pushed - see release.yml for the flow:
# batch fixes on main, then bump version + tag when ready to release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

