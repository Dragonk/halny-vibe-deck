name: release-dioxus

# Dev builds for the Rust edition (branch next, tags v1.99.*).
# Ways to start a dev build:
#   1. Push a tag matching v*-dioxus* or v1.99.* (classic).
#   2. Push a commit to next whose message contains a marker
#      "[release vX.Y.Z]" — the "tag" job resolves the version, creates the
#      tag (or moves it to the pushed commit) and the pipeline continues.
#      (workflows started by GITHUB_TOKEN never trigger other workflows, so
#      tag-on-marker-created tags cannot start this workflow — hence marker #2.)
#   3. workflow_dispatch with a tag input (full pipeline, tag is created/moved).
# Bundles are uploaded as workflow-run artifacts ("bundles"); NO GitHub Release
# is created — 1.99.x are dev-only tags and must not disturb the stable release
# channel of the Electron edition on main.
on:
  push:
    tags:
      - "v*-dioxus*"
      - "v1.99.*"
    branches:
      - next
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.99.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: v1.99.0
  PDFIUM_TAG: chromium/7881

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release v') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(printf '%s' "$COMMIT_MSG" | grep -oP '\[release \K[^\]]+' | head -n1 || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "ERROR: could not resolve release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"
      - name: Ensure tag points at this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} exists; moving it to ${GITHUB_SHA}"
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" -F force=true >/dev/null
          else
            echo "Creating tag ${TAG} on ${GITHUB_SHA}"
            gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
          fi

  test:
    name: Test workspace
    needs: tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Test (workspace)
        run: cargo test --workspace --locked

      - name: Test (mistraldeck, server feature)
        run: cargo test -p mistraldeck --features server --locked

  bundles:
    name: Bundles (linux x64 + windows x64)
    runs-on: ubuntu-22.04
    needs: [tag, test]
    env:
      CARGO_TARGET_DIR: /home/runner/vd-target
    steps:
      - name: Export build version (release tag) to env
        # Embed the release tag in the binary so the in-app updater can tell
        # releases apart (option_env!("HALNY_VIBE_DECK_BUILD_VERSION") in the
        # engine) and name the bundle assets after it. Step-level: job-level
        # env referencing needs.tag.outputs made every non-release push fail
        # at workflow compile time (outputs of a skipped needed job are not
        # addressable).
        run: |
          echo "HALNY_VIBE_DECK_BUILD_VERSION=${{ needs.tag.outputs.tag }}" >> "$GITHUB_ENV"
          echo "MISTRALDECK_BUILD_VERSION=${{ needs.tag.outputs.tag }}" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.tag.outputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev mingw-w64

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build web bundle (wasm + public/)
        working-directory: crates/mistraldeck
        run: dx build --fullstack --web --release

      - name: Build linux server binary (gui + headless)
        run: |
          cargo build --profile server-release -p mistraldeck --features server,gui --locked
          strip --strip-all "$CARGO_TARGET_DIR/server-release/halny-vibe-deck"

      - name: Build windows server binary (x86_64-pc-windows-gnu)
        run: |
          cargo build --profile server-release -p mistraldeck --features server,gui --target x86_64-pc-windows-gnu --locked
          x86_64-w64-mingw32-strip --strip-all "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/halny-vibe-deck.exe"
          x86_64-w64-mingw32-objdump -h "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/halny-vibe-deck.exe" | grep -q '\.rsrc' || { echo 'ERROR: .rsrc section missing — icon was not embedded'; exit 1; }

      - name: Build appserver binaries (headless)
        run: |
          cargo build --profile server-release -p mistraldeck-appserver --locked
          strip --strip-all "$CARGO_TARGET_DIR/server-release/halny-vibe-deck-appserver"
          cargo build --profile server-release -p mistraldeck-appserver --target x86_64-pc-windows-gnu --locked
          x86_64-w64-mingw32-strip --strip-all "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/halny-vibe-deck-appserver.exe"

      - name: Fetch pdfium binaries
        run: |
          mkdir -p pdfium && cd pdfium
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz" | tar -xz
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz" | tar -xz

      - name: Assemble linux bundle
        run: |
          mkdir -p dist/halny-vibe-deck-linux
          cp "$CARGO_TARGET_DIR/server-release/halny-vibe-deck" dist/halny-vibe-deck-linux/halny-vibe-deck
          cp pdfium/lib/libpdfium.so dist/halny-vibe-deck-linux/
          cp -r "$CARGO_TARGET_DIR/dx/halny-vibe-deck/release/web/public" dist/halny-vibe-deck-linux/public
          tar -czf "halny-vibe-deck-${VERSION}-linux-x64.tar.gz" -C dist/halny-vibe-deck-linux .

      - name: Assemble windows bundle
        run: |
          mkdir -p dist/halny-vibe-deck-win
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/halny-vibe-deck.exe" dist/halny-vibe-deck-win/HalnyVibeDeck.exe
          WEBVIEW2_LOADER=$(find "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/build" -path '*webview2-com-sys*/out/x64/WebView2Loader.dll' -print -quit)
          test -n "$WEBVIEW2_LOADER" || { echo "WebView2Loader.dll not found"; exit 1; }
          cp "$WEBVIEW2_LOADER" dist/halny-vibe-deck-win/
          cp pdfium/bin/pdfium.dll dist/halny-vibe-deck-win/
          cp -r "$CARGO_TARGET_DIR/dx/halny-vibe-deck/release/web/public" dist/halny-vibe-deck-win/public
          cd dist/halny-vibe-deck-win && zip -q -r "../../halny-vibe-deck-${VERSION}-windows-x64.zip" .

      - name: Assemble appserver bundles
        run: |
          mkdir -p dist/halny-vibe-deck-appserver-linux
          cp "$CARGO_TARGET_DIR/server-release/halny-vibe-deck-appserver" dist/halny-vibe-deck-appserver-linux/
          cp -r "$CARGO_TARGET_DIR/dx/halny-vibe-deck/release/web/public" dist/halny-vibe-deck-appserver-linux/public
          tar -czf "halny-vibe-deck-appserver-${VERSION}-linux-x64.tar.gz" -C dist/halny-vibe-deck-appserver-linux .
          mkdir -p dist/halny-vibe-deck-appserver-win
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/halny-vibe-deck-appserver.exe" dist/halny-vibe-deck-appserver-win/
          cp -r "$CARGO_TARGET_DIR/dx/halny-vibe-deck/release/web/public" dist/halny-vibe-deck-appserver-win/public
          cd dist/halny-vibe-deck-appserver-win && zip -q -r "../../halny-vibe-deck-appserver-${VERSION}-windows-x64.zip" .

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            halny-vibe-deck-*-linux-x64.tar.gz
            halny-vibe-deck-*-windows-x64.zip
            halny-vibe-deck-appserver-*-linux-x64.tar.gz
            halny-vibe-deck-appserver-*-windows-x64.zip
          if-no-files-found: error
