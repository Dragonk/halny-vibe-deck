name: release-dioxus

# Two ways to start a release:
#   1. Push a tag matching v*-dioxus* (classic).
#   2. Push a commit to next whose message contains a marker
#      `[release vX.Y.Z]` — the "tag" job resolves the version, creates the
#      tag (or moves it to the pushed commit) and the pipeline continues.
#      (workflows started by GITHUB_TOKEN never trigger other workflows, so
#      tag-on-marker-created tags cannot start this workflow — hence marker #2.)
#   3. workflow_dispatch with a tag input (full pipeline, tag is created/moved).
on:
  push:
    tags:
      - "v*-dioxus*"
    branches:
      - next
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.3-dioxus.5)"
        required: true

permissions:
  contents: write

env:
  VERSION: 0.8.3
  PDFIUM_TAG: chromium/7881

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release v') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: resolve
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(printf '%s' "$COMMIT_MSG" | grep -oP '\[release \K[^\]]+' | head -n1 || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "ERROR: could not resolve release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"
      - name: Ensure tag points at this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} exists; moving it to ${GITHUB_SHA}"
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" -F force=true >/dev/null
          else
            echo "Creating tag ${TAG} on ${GITHUB_SHA}"
            gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
          fi

  test:
    name: Test workspace
    needs: tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Test (workspace)
        run: cargo test --workspace --locked

      - name: Test (mistraldeck, server feature)
        run: cargo test -p mistraldeck --features server --locked

  bundles:
    name: Bundles (linux x64 + windows x64)
    runs-on: ubuntu-22.04
    needs: [tag, test]
    env:
      CARGO_TARGET_DIR: /home/runner/vd-target
      # Embed the release tag in the binary so the in-app updater can tell
      # releases apart (option_env!("MISTRALDECK_BUILD_VERSION") in the engine).
      MISTRALDECK_BUILD_VERSION: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev mingw-w64

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build web bundle (wasm + public/)
        working-directory: crates/mistraldeck
        run: dx build --fullstack --web --release

      - name: Build linux server binary (gui + headless)
        run: |
          cargo build --profile server-release -p mistraldeck --features server,gui --locked
          strip --strip-all "$CARGO_TARGET_DIR/server-release/mistraldeck"

      - name: Build windows server binary (x86_64-pc-windows-gnu)
        run: |
          cargo build --profile server-release -p mistraldeck --features server,gui --target x86_64-pc-windows-gnu --locked
          x86_64-w64-mingw32-strip --strip-all "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/mistraldeck.exe"
          x86_64-w64-mingw32-objdump -h "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/mistraldeck.exe" | grep -q '\.rsrc' || { echo 'ERROR: .rsrc section missing — icon was not embedded'; exit 1; }


      - name: Build appserver binaries (headless)
        run: |
          cargo build --profile server-release -p mistraldeck-appserver --locked
          strip --strip-all "$CARGO_TARGET_DIR/server-release/mistraldeck-appserver"
          cargo build --profile server-release -p mistraldeck-appserver --target x86_64-pc-windows-gnu --locked
          x86_64-w64-mingw32-strip --strip-all "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/mistraldeck-appserver.exe"

      - name: Fetch pdfium binaries
        run: |
          mkdir -p pdfium && cd pdfium
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz" | tar -xz
          curl -sL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz" | tar -xz

      - name: Assemble linux bundle
        run: |
          mkdir -p dist/mistraldeck-linux
          cp "$CARGO_TARGET_DIR/server-release/mistraldeck" dist/mistraldeck-linux/mistraldeck
          cp pdfium/lib/libpdfium.so dist/mistraldeck-linux/
          cp -r "$CARGO_TARGET_DIR/dx/mistraldeck/release/web/public" dist/mistraldeck-linux/public
          tar -czf "mistraldeck-${VERSION}-linux-x64.tar.gz" -C dist/mistraldeck-linux .

      - name: Assemble windows bundle
        run: |
          mkdir -p dist/mistraldeck-win
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/mistraldeck.exe" dist/mistraldeck-win/MistralDeck.exe
          WEBVIEW2_LOADER=$(find "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/build" -path '*webview2-com-sys*/out/x64/WebView2Loader.dll' -print -quit)
          test -n "$WEBVIEW2_LOADER" || { echo 'WebView2Loader.dll not found'; exit 1; }
          cp "$WEBVIEW2_LOADER" dist/mistraldeck-win/
          cp pdfium/bin/pdfium.dll dist/mistraldeck-win/
          cp -r "$CARGO_TARGET_DIR/dx/mistraldeck/release/web/public" dist/mistraldeck-win/public
          cd dist/mistraldeck-win && zip -q -r "../../mistraldeck-${VERSION}-windows-x64.zip" .

      - name: Assemble appserver bundles
        run: |
          mkdir -p dist/mistraldeck-appserver-linux
          cp "$CARGO_TARGET_DIR/server-release/mistraldeck-appserver" dist/mistraldeck-appserver-linux/
          cp -r "$CARGO_TARGET_DIR/dx/mistraldeck/release/web/public" dist/mistraldeck-appserver-linux/public
          tar -czf "mistraldeck-appserver-${VERSION}-linux-x64.tar.gz" -C dist/mistraldeck-appserver-linux .
          mkdir -p dist/mistraldeck-appserver-win
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/server-release/mistraldeck-appserver.exe" dist/mistraldeck-appserver-win/
          cp -r "$CARGO_TARGET_DIR/dx/mistraldeck/release/web/public" dist/mistraldeck-appserver-win/public
          cd dist/mistraldeck-appserver-win && zip -q -r "../../mistraldeck-appserver-${VERSION}-windows-x64.zip" .

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            mistraldeck-*-linux-x64.tar.gz
            mistraldeck-*-windows-x64.zip
            mistraldeck-appserver-*-linux-x64.tar.gz
            mistraldeck-appserver-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [tag, bundles]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Mistral Deck ${{ needs.tag.outputs.tag }}
          prerelease: true
          files: dist/*
          body: |
            **Mistral Deck — unofficial desktop + remote GUI (Rust · Dioxus 0.7 fullstack) for the Mistral Vibe CLI.**

            > ⚠️ Mistral Deck is an **unofficial community project** and is not affiliated with, endorsed by, or supported by Mistral AI.

            ## Binaries

            | Platform | File |
            |---|---|
            | Linux (x86_64, glibc) | `mistraldeck-0.8.3-linux-x64.tar.gz` |
            | Windows (x86_64) | `mistraldeck-0.8.3-windows-x64.zip` |
            | Linux headless server | `mistraldeck-appserver-0.8.3-linux-x64.tar.gz` |
            | Windows headless server | `mistraldeck-appserver-0.8.3-windows-x64.zip` |

            ## What's new (M9.4 — Nexus 0.7.1 parity, v0.8.3-dioxus.6)

            - Resizable panels: drag the sidebar and dock edges; widths are remembered.
            - File and diff previews open as tabs next to Files/Git (close with X button); the dock keeps a stable width.
            - Settings: Global/Project scope for skills and prompts, auto UI language (follows browser/OS) and auto color mode.
            - Frameless desktop window with custom title bar buttons (minimize / maximize / close) and edge resizing.
            - Tool calls color-coded (green done / amber running / red error) with collapsible bodies.
            - Fixed: Stats/History tab crashed on load in the browser; model/mode/thinking dropdowns open mid-session again.
            - Sidebar: collapsible project groups, busy spinner + cancel, right-click context menu with delete confirmation.

            ## What's new (M9)

            - Real file previews: PDF (rasterized pages via bundled pdfium), DOCX/ODT (styled document flow), PPTX/ODP (slide cards), XLSX/XLS/ODS (all sheets as clickable tabs), images, Markdown + Mermaid, code with syntax highlighting.
            - Edit in place: text/Markdown/CSV/code previews open in the code editor (highlighting, line numbers) with Save.
            - First Windows build (`MistralDeck.exe`, cross-compiled with MinGW; WebView2 required on Windows 10/11).
            - No console window on double-click: on Windows the app opens the GUI window directly; `--mode headless` still runs the headless server when needed.
            - Bundled `WebView2Loader.dll` next to `MistralDeck.exe` — required by the Windows webview (fixes the "WebView2Loader.dll not found" system error).
            - Bundled pdfium (`libpdfium.so` / `pdfium.dll`) next to the binary — PDF previews work out of the box.

            ## M9 fixes (v0.8.3-dioxus.5)

            - Fixed: the Windows GUI window now actually opens — the tao event loop is created with `any_thread` (previously the gui thread panicked silently and double-clicking showed no window at all).
            - `MistralDeck.exe` now embeds the mistral-vibe-nexus application icon (Explorer, taskbar).
            - Closing the desktop window quits the whole app; on Windows panics are written to `mistraldeck.log` next to the exe for diagnosis.

            ## Requirements

            - Linux: webkit2gtk 4.1 runtime (on Debian/Ubuntu: `sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0`), glibc-based distro.
            - Windows: 10/11 with WebView2 (preinstalled on current systems; otherwise install from Microsoft).
            - Vibe CLI / `vibe-acp` (see first-run Setup in the app).

            ## Usage

            - `./mistraldeck` — auto: opens the desktop window (on Windows always; on Linux when a display is available), otherwise headless server.
            - `./mistraldeck --mode gui` — force desktop window.
            - `./mistraldeck --mode headless` — headless server; reach the UI at `http://127.0.0.1:8080` (login required).
- `./mistraldeck-appserver` — the same headless server as a dedicated console binary (no webview code compiled in; GUI is always disabled).
            - `./mistraldeck --port 1234` / `--set-login user pass` — configure the remote server.
