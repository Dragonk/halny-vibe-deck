<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-256.png" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <meta name="theme-color" content="#111115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mistral Vibe Nexus</title>
  </head>
  <body>
    <div id="root">
      <!-- v0.13.4: boot loader - in serve mode the browser paints this
           dark loading state until the bundle arrives and React mounts
           (React replaces #root content on first render). Electron shows
           it briefly instead of a black window. -->
      <div id="boot" style="position:fixed;inset:0;background:#111115;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,sans-serif;z-index:99999">
        <div style="font-size:17px;font-weight:600;color:#e8eaf0;letter-spacing:.4px">Mistral Vibe Nexus</div>
        <style>#boot .nexus-spin{width:28px;height:28px;border:3px solid #2a2d3a;border-top-color:#7c8cf8;border-radius:50%;animation:nexus-spin .8s linear infinite}@keyframes nexus-spin{to{transform:rotate(360deg)}}</style>
        <div class="nexus-spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
