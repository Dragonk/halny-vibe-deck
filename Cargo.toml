[workspace]
resolver = "2"
members = [
    "crates/halny-vibe-deck-core",
    "crates/halny-vibe-deck-vibe",
    "crates/halny-vibe-deck-setup",
    "crates/halny-vibe-deck-engine",
    "crates/halny-vibe-deck",
    "crates/halny-vibe-deck-appserver",
    "crates/halny-vibe-deck-appsrv",
]

[workspace.package]
version = "1.99.23"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Dragonk/halny-vibe-deck"
description = "Mistral Deck — an unofficial desktop GUI for the Mistral Vibe CLI"

[workspace.dependencies]
halny-vibe-deck-core = { path = "crates/halny-vibe-deck-core" }
halny-vibe-deck-vibe = { path = "crates/halny-vibe-deck-vibe" }
halny-vibe-deck-setup = { path = "crates/halny-vibe-deck-setup" }
halny-vibe-deck-engine = { path = "crates/halny-vibe-deck-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
anyhow = "1"
dirs = "5"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.server-release]
inherits = "release"
