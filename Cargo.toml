[workspace]
resolver = "2"
members = [
    "crates/mistraldeck-core",
    "crates/mistraldeck-acp",
    "crates/mistraldeck-vibe",
    "crates/mistraldeck-setup",
    "crates/mistraldeck-app",
    "crates/mistraldeck-engine",
    "crates/mistraldeck",
    "crates/mistraldeck-appserver",
]

[workspace.package]
version = "0.8.3"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Dragonk/mistraldeck"
description = "Mistral Deck — an unofficial desktop GUI for the Mistral Vibe CLI"

[workspace.dependencies]
mistraldeck-core = { path = "crates/mistraldeck-core" }
mistraldeck-acp = { path = "crates/mistraldeck-acp" }
mistraldeck-vibe = { path = "crates/mistraldeck-vibe" }
mistraldeck-setup = { path = "crates/mistraldeck-setup" }
mistraldeck-engine = { path = "crates/mistraldeck-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
dirs = "5"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.server-release]
inherits = "release"
