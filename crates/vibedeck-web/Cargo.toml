[package]
name = "vibedeck-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VibeDeck web UI (Dioxus fullstack) - same app for desktop webview and remote browser"

[dependencies]
dioxus = { version = "0.7", features = ["launch", "fullstack"] }
dioxus-fullstack = "0.7"
vibedeck-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vibedeck-engine = { workspace = true, optional = true }
vibedeck-vibe = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio = { version = "1", features = ["time"] }
# optional server-side preview parsers (same versions as the egui app)
calamine = { version = "0.37", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.42", optional = true }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
pdf-extract = { version = "0.7", optional = true }
wry = { version = "0.53.5", optional = true }
tao = { version = "0.34", optional = true }

# client-side (wasm) browser/OS integration: navigator.language, window.ipc
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator"] }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "dep:vibedeck-engine", "tokio/rt-multi-thread", "tokio/macros", "dep:calamine", "dep:zip", "dep:pdf-extract", "dep:quick-xml", "dep:pdfium-render", "dep:image", "dep:vibedeck-vibe", "dep:toml"]
gui = ["dep:wry", "dep:tao"]
