<!DOCTYPE html>
<html>
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
        <meta charset="UTF-8">
        <link rel="manifest" href="/manifest.webmanifest">
        <link rel="icon" href="/icon-256.png">
        <link rel="apple-touch-icon" href="/icon-256.png">
        <meta name="theme-color" content="#111115">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    </head>
    <body>
        <!-- v0.13.4 parity: dark boot loader — the browser paints this dark
             loading state until the app mounts into #main (no long white
             flash in serve mode). The script below removes it as soon as
             #main has content (SSR paint or client mount). -->
        <div id="vd-boot" style="position:fixed;inset:0;background:#111115;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,sans-serif;z-index:99999">
            <div style="font-size:17px;font-weight:600;color:#e8eaf0;letter-spacing:.4px">Halny Vibe Deck</div>
            <style>#vd-boot .vd-spin{width:28px;height:28px;border:3px solid #2a2d3a;border-top-color:#7c8cf8;border-radius:50%;animation:vd-spin .8s linear infinite}@keyframes vd-spin{to{transform:rotate(360deg)}}</style>
            <div class="vd-spin"></div>
        </div>
        <div id="main"></div>
        <script>
            (function () {
                // Remove the boot loader as soon as the app mounts into
                // #main — SSR content paints with the document, client
                // mounts fill it later (MutationObserver covers both).
                var boot = document.getElementById('vd-boot');
                if (!boot) return;
                var main = document.getElementById('main');
                var done = false;
                var remove = function () {
                    if (done) return;
                    done = true;
                    boot.remove();
                };
                if (main && main.childNodes.length > 0) {
                    remove();
                } else if (main && typeof MutationObserver === 'function') {
                    var obs = new MutationObserver(function () {
                        if (main.childNodes.length > 0) {
                            obs.disconnect();
                            remove();
                        }
                    });
                    obs.observe(main, { childList: true });
                }
                setTimeout(remove, 15000); // never trap the user on the boot screen

                // PWA: register the service worker (serve mode, http/https).
                if (
                    'serviceWorker' in navigator &&
                    (location.protocol === 'http:' || location.protocol === 'https:')
                ) {
                    navigator.serviceWorker.register('/sw.js').catch(function () {});
                }
            })();
        </script>
    </body>
</html>
