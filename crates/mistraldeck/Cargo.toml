[package]
name = "mistraldeck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Halny Vibe Deck web UI (Dioxus fullstack) - same app for desktop webview and remote browser"

[[bin]]
name = "halny-vibe-deck"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["launch", "fullstack"] }
dioxus-fullstack = "0.7"
mistraldeck-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mistraldeck-engine = { workspace = true, optional = true }
mistraldeck-vibe = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio = { version = "1", features = ["time"] }
# optional server-side preview parsers (same versions as the egui app)
calamine = { version = "0.37", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.42", optional = true }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "ico"], optional = true }
pdf-extract = { version = "0.7", optional = true }
wry = { version = "0.53.5", optional = true }
tao = { version = "0.34", optional = true }
# remote HTTPS listener (serve.rs): axum middleware + rustls TLS + a
# self-signed certificate generator. Feature-unified with the reqwest
# rustls already in the graph (ring provider — NOT aws-lc-rs, which does
# not build on windows-gnu).
axum = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"], optional = true }
# gzip middleware (serve mode, Nexus v0.13.4 parity) — flate2 is already in
# the graph via the `zip` crate, no new downloads.
flate2 = { version = "1", optional = true }

# client-side (wasm) browser/OS integration: navigator.language, window.ipc
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator"] }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "dep:mistraldeck-engine", "tokio/rt-multi-thread", "tokio/macros", "dep:calamine", "dep:zip", "dep:pdf-extract", "dep:quick-xml", "dep:pdfium-render", "dep:image", "dep:mistraldeck-vibe", "dep:toml", "dep:axum", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types", "dep:rcgen", "dep:flate2"]
gui = ["dep:wry", "dep:tao"]
