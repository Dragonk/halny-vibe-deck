[package]
name = "vibedeck-app"
description = "VibeDeck — native desktop GUI for the Mistral Vibe CLI (egui/wgpu, no Electron)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "vibedeck"

[[bin]]
name = "vibedeck"
path = "src/main.rs"

[dependencies]
vibedeck-core = { workspace = true }
vibedeck-acp = { workspace = true }
vibedeck-vibe = { workspace = true }
vibedeck-setup = { workspace = true }

eframe = { version = "0.29", features = ["wgpu"] }
egui = { version = "0.29" }
# image loaders for the dock file previews (Image::from_bytes)
egui_extras = { version = "0.29", default-features = false, features = ["image"] }
# same `image` crate as the egui_extras loader — feature-united so previews
# decode gif/bmp/webp/tiff/ico in addition to png+jpeg
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "webp", "tiff", "ico",
] }
png = "0.17"
# file preview formats (workspace dock)
calamine = "0.37"
zip = { version = "9", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
# real previews: styled docx/pptx parsing (quick-xml), rendered pdf pages (pdfium)
quick-xml = "0.42"
pdfium-render = { version = "0.9", default-features = false, features = [
    "pdfium_latest",
    "thread_safe",
] }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
# OS locale sniffing for the "System" language preference
sys-locale = "0.3"

# Windows-only: embed the window icon into the executable resource section.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Windows-only: DWM rounded window corners on Windows 11 (DwmSetWindowAttribute).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"
