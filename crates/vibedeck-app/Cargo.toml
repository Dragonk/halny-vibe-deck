[package]
name = "vibedeck-app"
description = "VibeDeck — native desktop GUI for the Mistral Vibe CLI (egui/wgpu, no Electron)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "vibedeck"

[[bin]]
name = "vibedeck"
path = "src/main.rs"

[dependencies]
vibedeck-core = { workspace = true }
vibedeck-acp = { workspace = true }
vibedeck-vibe = { workspace = true }
vibedeck-setup = { workspace = true }

eframe = { version = "0.29", features = ["wgpu"] }
egui = { version = "0.29" }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
