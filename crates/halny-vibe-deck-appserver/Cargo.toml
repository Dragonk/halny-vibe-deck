[package]
name = "halny-vibe-deck-appserver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Halny Vibe Deck headless app server — the same axum server + engine as the desktop app, without the webview (console binary)"
publish = false

[dependencies]
halny-vibe-deck = { path = "../halny-vibe-deck", features = ["server"] }

[[bin]]
name = "halny-vibe-deck-appserver"
path = "src/main.rs"
